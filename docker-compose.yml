# Этап 2: только независимые PostgreSQL. API запускаются локально.
# Kafka и контейнеры приложений добавляются в следующих этапах.
services:
  users-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users-development
      POSTGRES_DB: users_db
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events-development
      POSTGRES_DB: events_db
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - events_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookings
      POSTGRES_PASSWORD: bookings-development
      POSTGRES_DB: bookings_db
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - bookings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookings -d bookings_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  users_pgdata:
  events_pgdata:
  bookings_pgdata:
